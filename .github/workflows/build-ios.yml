name: build-ios

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20260508232728-bebd421c7fa8
          go install golang.org/x/mobile/cmd/gobind@v0.0.0-20260508232728-bebd421c7fa8
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: versions
        run: |
          go version; xcodebuild -version; gomobile version || true
      - name: build unsigned ipa
        run: |
          gomobile init
          bash build-ios.sh proxy
      - name: checksum
        run: |
          ls -la prebuilts/
          shasum -a 256 prebuilts/whitelist-bypass-proxy.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: whitelist-bypass-proxy-v0.4.4-tcpturn
          path: prebuilts/whitelist-bypass-proxy.ipa
          retention-days: 3
      - name: publish ipa to branch out
        run: |
          set -e
          SHA=$(shasum -a 256 prebuilts/whitelist-bypass-proxy.ipa | cut -d' ' -f1)
          mkdir -p /tmp/out && cp prebuilts/whitelist-bypass-proxy.ipa /tmp/out/
          echo "$SHA  whitelist-bypass-proxy.ipa" > /tmp/out/SHA256SUMS
          cd /tmp/out
          git init -q -b out
          git -c user.name=github-actions -c user.email=actions@github.com add -A
          git -c user.name=github-actions -c user.email=actions@github.com commit -qm "ipa ${GITHUB_SHA::7} sha256 $SHA"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}" out
